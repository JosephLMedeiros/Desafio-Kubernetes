apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: desafio-kubernets
  labels:
    app.kubernetes.io/part-of: desafio-kubernets
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-bd
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi